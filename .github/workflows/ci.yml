name: Node.js CI

on:
  push:
    branches: [ "main", "feature/mvp-triagem-estoque" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Usar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        
    - name: Instalar dependências
      run: npm ci
      
    - name: Executar testes automatizados
      run: npm test